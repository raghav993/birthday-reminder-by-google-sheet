<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birthdays</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" href="https://fav.farm/🎂">

  <style>
    html {
      font-family: Poppins, system-ui;
    }
  </style>
</head>

<body class="theme-dark">

  <!-- TOP BAR -->
  <header class="topbar">
    <h1>Birthdays 🎉</h1>
    <div class="actions">
      <input id="searchInput" placeholder="Search..." />
      <select id="monthFilter">
        <option value="all">All months</option>
        <option value="1">Jan</option>
        <option value="2">Feb</option>
        <option value="3">Mar</option>
        <option value="4">Apr</option>
        <option value="5">May</option>
        <option value="6">Jun</option>
        <option value="7">Jul</option>
        <option value="8">Aug</option>
        <option value="9">Sep</option>
        <option value="10">Oct</option>
        <option value="11">Nov</option>
        <option value="12">Dec</option>
      </select>
      <button id="themeToggle">🌙</button>
      <button id="openModalBtn">➕ Add New Birthday</button>
    </div>
  </header>

  <!-- LOADING & ERROR -->
  <div class="container mx-auto mt-6">
    <div id="loading" class="flex items-center justify-center py-10">
      <div class="loader"></div>
    </div>
    <div id="error" class="hidden text-center text-red-400 font-semibold">⚠ Failed to load data</div>
  </div>

  <!-- MAIN CONTENT -->
  <main id="content" class="container mx-auto space-y-7 hidden">

    <!-- TODAY BIRTHDAY BIG BANNER -->
    <section id="todaySection">
      <div class="flex justify-center mb-3">
        <h2 class="sectionTitle">🎂 Today</h2>
      </div>

      <!-- BIG BIRTHDAY FRAME -->
      <div id="bigTodayFrame" class="today-hero hidden">
        <div class="bannerCard">
          <!-- static bg is in CSS, yaha sirf photo dynamic -->
          <img id="dynamicTodayImg" class="bannerAvatar" src="" alt="photo" />
          <br><br>
          <div class="bannerText">
            <h3 id="dynamicTodayName" class="bannerName"></h3>
            <p id="dynamicTodayDate" class="bannerMeta"></p>
            <p id="dynamicTodayDay" class="bannerMeta"></p>
            <div class="confettiText">✨ Lots of love & celebrations ✨</div>
          </div>
        </div>
      </div>

      <div class="gridCards"></div>
      <div id="todayCount" class="countTag"></div>
    </section>


    <!-- UPCOMING -->
    <section id="upcomingSection">
      <h2 class="sectionTitle">⬆ Upcoming</h2>
      <div class="gridCards"></div>
      <div id="upcomingCount" class="countTag"></div>
    </section>
    <br>
    <hr>

    <!-- PAST BIRTHDAY BIG BANNER -->
    <section id="pastSection">
      <h2 class="sectionTitle">⏮ Recent</h2>

      <div id="bigPastFrame" class="hidden flex justify-center mb-6">
        <div class="bannerCard past">
          <img id="dynamicPastImg" class="bannerAvatar pastAvatar" src="" />
          <h3 id="dynamicPastName" class="bannerName"></h3>
          <p id="dynamicPastDate"></p>
          <p id="dynamicPastDay"></p>
          <div class="pastTag">⏰ This birthday has passed</div>
        </div>
      </div>

      <div class="gridCards"></div>
      <div id="pastCount" class="countTag"></div>
    </section>

  </main>

  <!-- NORMAL GRID CARD TEMPLATE -->
  <template id="cardTemplate">
    <div class="card">
      <img class="avatar" src="" />
      <div class="info">
        <div class="name"></div>
        <div class="birthday"></div>
        <div class="birthdayDay"></div>
        <div class="age"></div>
        <div class="genderBadge"></div>
      </div>
    </div>
  </template>

  <!-- ADD DOB MODAL ✅ single one -->
  <div id="birthdayModal" class="modal hidden">
    <div class="modalBox">
      <h3 class="font-bold mb-3">Add Birthday 🎉</h3>

      <input id="newName" placeholder="Name" required />
      <input id="newEmail" placeholder="Email" required />
      <input id="newDOB" type="date" required />

      <select id="newGender" class="w-full px-3 py-2 rounded-lg border">
        <option value="male">♂ Male</option>
        <option value="female">♀ Female</option>
        <option value="other">⚧ Other</option>
      </select>

      <input id="newImage" placeholder="Direct Image URL (optional)" />

      <div class="grid2 mt-4">
        <button id="saveBirthdayBtn">💾 Save</button>
        <button id="closeModalBtn">✖ Cancel</button>
      </div>
    </div>
  </div>

  <div id="detailPopup">
    <div id="popupBox">
      <!-- Big Profile Image -->
      <img id="pImg" class="avatar" src="" />
      <!-- User Details -->
      <div class="name" id="pName"></div>
      <div class="meta" id="pDate"></div>
      <div class="meta pday" id="pDay"></div>
      <!-- Age -->
      <div class="text-center my-3 text-sm">🎉 Turning <b id="detailAge">--</b> years</div>

      <!-- Footer -->
      <div class="text-center text-xs py-2 border-t border-gray-600/20 mt-4">🎂 Friends & team, get ready to celebrate!
      </div>

      <!-- Close -->
      <button id="popupCloseBtn" class="block mx-auto mt-3">Close ✖</button>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
