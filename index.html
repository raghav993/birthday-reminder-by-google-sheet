<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Birthday Reminder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" defer></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
  <style>
    html {
      font-family: Poppins, system-ui
    }
  </style>
</head>

<body class="bg-gradient-to-br from-white via-slate-50 to-slate-100 min-h-screen text-slate-800">
  <div class="container mx-auto p-6">
    <header class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl md:text-4xl font-semibold">Team Birthday Reminder</h1>
        <p class="text-sm text-slate-500">Powered by Google Sheets</p>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <input id="searchInput" placeholder="Search by name..."
          class="rounded-lg px-4 py-2 shadow-sm border border-slate-200 w-full md:w-64" />
        <select id="monthFilter" class="rounded-lg px-3 py-2 shadow-sm border border-slate-200">
          <option value="all">All months</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>
    </header>

    <div id="uiArea">
      <div id="loading" class="flex items-center justify-center py-12">
        <div class="loader"></div>
      </div>
      <div id="error" class="hidden bg-red-50 border-l-4 border-red-400 text-red-700 p-4 rounded">
        <p id="errorMsg">Failed to load data.</p>
      </div>

      <main id="content" class="space-y-8 hidden">
        <section data-aos="fade-up">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-2xl font-semibold">🎂 Today's Birthdays</h2>
            <div id="todayCount" class="text-sm text-slate-500"></div>
          </div>
          <div id="todaySection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <section data-aos="fade-up">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-2xl font-semibold">⬆ Upcoming Birthdays</h2>
            <div id="upcomingCount" class="text-sm text-slate-500"></div>
          </div>
          <div id="upcomingSection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <section data-aos="fade-up">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-2xl font-semibold">⬇ Recent / Past Birthdays</h2>
            <div id="pastCount" class="text-sm text-slate-500"></div>
          </div>
          <div id="pastSection" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>
      </main>
    </div>
  </div>

  <template id="cardTemplate">
    <div class="card bg-white rounded-2xl p-4 shadow-lg transform transition-transform hover:scale-105">
      <div class="flex items-center gap-3">
        <img class="avatar w-20 h-20 rounded-full object-cover border" src="" alt="photo">
        <div class="flex-1">
          <div class="flex items-center justify-between">
            <h3 class="name text-lg font-semibold"></h3>
            <div class="genderBadge text-sm px-2 py-1 rounded-full"></div>
          </div>
          <p class="birthday text-sm text-slate-500"></p>
          <p class="age text-sm text-slate-400 mt-1"></p>
        </div>
      </div>
    </div>
  </template>

  <script src="script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.AOS) {
        AOS.init({
          duration: 600,
          once: true,
          offset: 60
        });
      }
    });
  </script>

</body>

</html>
